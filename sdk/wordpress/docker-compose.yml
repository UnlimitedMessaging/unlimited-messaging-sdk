# Local WordPress + WooCommerce to try the plugin against the local API.
# `bin/setup.sh` then http://localhost:19450 (local-only admin / admin).
name: um-wordpress

services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: wordpress
    volumes:
      - db:/var/lib/mysql

  wordpress:
    image: wordpress:6-php8.3-apache
    depends_on: [db]
    ports:
      - "19450:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
    # WordPress runs WP-Cron and WooCommerce's Action Scheduler (which sends
    # the plugin's messages) by calling its own URL, http://localhost:19450.
    # Inside the container nothing listens on 19450, so those calls failed and
    # queued messages never left: Apache listens on 19450 too.
    command:
      - bash
      - -c
      - >-
        grep -q 'Listen 19450' /etc/apache2/ports.conf || echo 'Listen 19450' >> /etc/apache2/ports.conf;
        sed -i 's/<VirtualHost \*:80>/<VirtualHost *:80 *:19450>/' /etc/apache2/sites-available/000-default.conf;
        exec docker-entrypoint.sh apache2-foreground
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - wp:/var/www/html
      - ./unlimited-messaging:/var/www/html/wp-content/plugins/unlimited-messaging

  cli:
    image: wordpress:cli-php8.3
    depends_on: [db, wordpress]
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - wp:/var/www/html
      - ./unlimited-messaging:/var/www/html/wp-content/plugins/unlimited-messaging
    entrypoint: ["wp"]
    profiles: [cli]

volumes:
  db:
  wp:
