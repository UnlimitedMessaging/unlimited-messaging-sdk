name: Release SDKs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─── Notification de début ─────────────────────────────────────────────────
  notify-start:
    uses: ./.github/workflows/_discord_notif.yml
    with:
      message: "Release pipeline démarrée"
      status: "pending"
    secrets: inherit

  # ─── Pipeline principale ───────────────────────────────────────────────────
  release:
    name: Generate & publish SDKs
    needs: notify-start
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      packages: ${{ steps.summary.outputs.packages }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect what changed
        id: detect
        run: |
          CHANGED=$(git diff HEAD~1 --name-only 2>/dev/null || echo "")

          OPENAPI=false
          if grep -qx "openapi.yaml" <<< "$CHANGED"; then OPENAPI=true; fi

          # Hand-written SDK code (the n8n node) changes without the spec ever
          # moving. Previously nothing triggered a release for that, so such a
          # change would sit in main, published nowhere, until an unrelated spec
          # update happened to carry it out.
          SOURCE=false
          if grep -qE "^sdk/" <<< "$CHANGED"; then SOURCE=true; fi

          RELEASE=false
          if [ "$OPENAPI" = "true" ] || [ "$SOURCE" = "true" ] \
             || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE=true
          fi

          echo "openapi_changed=$OPENAPI" >> $GITHUB_OUTPUT
          echo "should_release=$RELEASE" >> $GITHUB_OUTPUT
          echo "openapi=$OPENAPI source=$SOURCE -> release=$RELEASE"

      - name: Capture OpenAPI diff (for release notes)
        run: |
          DIFF=$(git diff HEAD~1 -- openapi.yaml 2>/dev/null || echo "")
          {
            echo "OPENAPI_DIFF<<EOFMARKER"
            echo "$DIFF"
            echo "EOFMARKER"
          } >> $GITHUB_ENV

      - name: Install Fern & regenerate SDKs
        if: steps.detect.outputs.openapi_changed == 'true'
        run: |
          npm install -g fern-api
          fern generate --group sdk --local --log-level debug

      - name: Setup npm auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc

      - name: Compute release version
        id: version
        if: steps.detect.outputs.should_release == 'true'
        run: bash .github/workflows/_version.sh

      - name: Publish TypeScript SDK
        id: ts
        if: steps.detect.outputs.should_release == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bash .github/workflows/_publish-typescript.sh

      - name: Publish Python SDK
        id: python
        if: steps.detect.outputs.should_release == 'true'
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: bash .github/workflows/_publish-python.sh

      - name: Publish n8n node
        id: n8n
        if: steps.detect.outputs.should_release == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bash .github/workflows/_publish-n8n.sh

      - name: Commit regenerated SDKs and version bump
        if: steps.detect.outputs.should_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sdk/
          git diff --cached --quiet || \
            git commit -m "chore: release v${{ steps.version.outputs.version }} [skip ci]"
          git push

      - name: Generate release notes
        if: steps.detect.outputs.should_release == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # The one version every package was just published at. Previously this
          # read the TypeScript SDK's package.json regardless of what actually
          # shipped, so an n8n-only release reused the existing tag and failed.
          echo "RELEASE_VERSION=${{ steps.version.outputs.version }}" >> $GITHUB_ENV
          NOTES=""

          if [ -n "$OPENAPI_DIFF" ] && [ -n "$GEMINI_API_KEY" ]; then
            NOTES=$(curl -sf \
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=$GEMINI_API_KEY" \
              -H "Content-Type: application/json" \
              --data "$(jq -n --arg diff "$OPENAPI_DIFF" '{
                contents: [{parts: [{text: ("You write release notes for a WhatsApp messaging SDK. Analyze this OpenAPI spec diff and write ONLY what actually changed: new endpoints, removed endpoints, changed parameters, new or removed response fields, renamed methods. If nothing changed in a category, do not mention it. Output only markdown bullet points, no intro sentence, no \"nothing changed\" statements.\n\nDiff:\n" + $diff)}]}],
                generationConfig: {}
              }')" | jq -r '.candidates[0].content.parts[0].text' 2>/dev/null) || NOTES=""
          fi

          [ -z "$NOTES" ] && NOTES="SDK update."

          {
            echo "RELEASE_NOTES<<EOFMARKER"
            echo "$NOTES"
            echo "EOFMARKER"
          } >> $GITHUB_ENV

      - name: Create GitHub Release
        if: steps.detect.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Idempotent so re-running a partially failed workflow cannot fail on
          # the tag alone, after the packages are already on npm and PyPI.
          if gh release view "v$RELEASE_VERSION" > /dev/null 2>&1; then
            echo "::warning::Release v$RELEASE_VERSION already exists, skipping"
            exit 0
          fi

          gh release create "v$RELEASE_VERSION" \
            --title "v$RELEASE_VERSION" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Update CHANGELOG.md
        if: steps.detect.outputs.should_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node -e "
            const fs = require('fs');
            const content = fs.readFileSync('CHANGELOG.md', 'utf8');
            const version = process.env.RELEASE_VERSION;
            const notes = process.env.RELEASE_NOTES;
            const date = new Date().toISOString().split('T')[0];
            const newEntry = \`\n## [\${version}] - \${date}\n\n\${notes}\n\`;
            const headerEnd = content.indexOf('\n## ');
            const insertAt = headerEnd === -1 ? content.length : headerEnd;
            const updated = content.slice(0, insertAt) + newEntry + content.slice(insertAt);
            fs.writeFileSync('CHANGELOG.md', updated);
          "
          git add CHANGELOG.md
          git diff --cached --quiet || git commit -m "chore: update CHANGELOG for v$RELEASE_VERSION [skip ci]"
          git push

      - name: Build packages summary
        id: summary
        if: always()
        run: |
          {
            echo "packages<<EOFMARKER"
            if [ "${{ steps.ts.outputs.published }}" = "true" ]; then
              echo "[@unlimited-messaging/sdk@${{ steps.ts.outputs.version }}](https://www.npmjs.com/package/@unlimited-messaging/sdk)"
            fi
            if [ "${{ steps.python.outputs.published }}" = "true" ]; then
              echo "[unlimited-messaging@${{ steps.python.outputs.version }}](https://pypi.org/project/unlimited-messaging/${{ steps.python.outputs.version }}/)"
            fi
            if [ "${{ steps.n8n.outputs.published }}" = "true" ]; then
              echo "[n8n-nodes-unlimited-messaging@${{ steps.n8n.outputs.version }}](https://www.npmjs.com/package/n8n-nodes-unlimited-messaging)"
            fi
            echo "EOFMARKER"
          } >> $GITHUB_OUTPUT

  # ─── Notification de fin ───────────────────────────────────────────────────
  notify-end:
    needs: release
    if: always()
    uses: ./.github/workflows/_discord_notif.yml
    with:
      message: ${{ needs.release.result == 'success' && 'Release pipeline réussie' || 'Release pipeline échouée' }}
      status: ${{ needs.release.result == 'success' && 'success' || 'fail' }}
      packages: ${{ needs.release.outputs.packages }}
    secrets: inherit
