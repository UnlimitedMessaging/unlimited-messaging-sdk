openapi: 3.0.0
paths:
  /media:
    post:
      description: |-
        **Protection**: Protected endpoint. Allowed roles: USER, ADMIN. Required scopes: OTHER:WRITE

        Uploads a media file and returns a temporary URL valid for 10 minutes. Pass that URL as `mediaUrl` in `POST /message` to send it as a WhatsApp message. Accepted types: images (`image/jpeg`, `image/png`, `image/webp`, `image/gif`), documents (`application/pdf`), and audio (`audio/webm`, `audio/ogg`, `audio/mpeg`, `audio/mp4`, `audio/aac`). Maximum file size: 16 MB. Audio files from browsers (WebM/Opus recorded via the MediaRecorder API) are automatically transcoded to OGG/Opus and delivered as WhatsApp voice notes (PTT) when sent via `POST /message`.
      operationId: Media_upload
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: "Media file to upload. Accepted: image/jpeg, image/png, image/webp, image/gif, application/pdf, audio/ogg, audio/webm, audio/mpeg, audio/mp4, audio/aac. Max 16 MB."
              required:
                - file
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                  mimeType:
                    type: string
                  filename:
                    type: string
                required:
                  - url
                  - mimeType
                additionalProperties: false
          description: ""
        "400":
          description: Invalid request parameters or body.
        "401":
          description: Missing or invalid authentication credentials.
        "403":
          description: Insufficient permissions to access this resource.
      security:
        - bearer: []
      summary: Upload a media file.
      tags:
        - Media
  /message:
    get:
      description: |-
        **Protection**: Protected endpoint. Allowed roles: USER, ADMIN. Required scopes: OTHER:READ

        Returns a paginated list of messages for the authenticated user. Supports filtering by `status`, `messagingAccountId`, and free-text `search`. Results are ordered by creation date (most recent first). Use `page` (default 1) and `limit` (1-100, default 20) to paginate. `simId` is a deprecated alias for `messagingAccountId`, removed 2026-12-16.
      operationId: Message_find_all
      parameters:
        - name: page
          required: false
          in: query
          schema:
            default: 1
            type: integer
            minimum: 1
            maximum: 9007199254740991
        - name: limit
          required: false
          in: query
          schema:
            default: 20
            type: integer
            minimum: 1
            maximum: 100
        - name: channel
          required: false
          in: query
          schema:
            type: string
            enum:
              - WHATSAPP
              - SMS
              - EMAIL
        - name: status
          required: false
          in: query
          schema:
            type: string
            enum:
              - PENDING
              - SENDING
              - SENT
              - DELIVERED
              - READ
              - FAILED
              - UNDELIVERABLE
        - name: direction
          required: false
          in: query
          schema:
            type: string
            enum:
              - IN
              - OUT
        - name: messagingAccountId
          required: false
          in: query
          schema:
            type: string
        - name: simId
          required: false
          in: query
          schema:
            type: string
        - name: search
          required: false
          in: query
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        content:
                          anyOf:
                            - type: string
                            - type: "null"
                        direction:
                          type: string
                          enum:
                            - IN
                            - OUT
                        fromMe:
                          type: boolean
                          description: True when the account holder sent this message (direction OUT), false when they received it (direction IN). Redundant with direction, but spares the client from having to know which enum value means "we sent it" - the same convention as WhatsApp's own fromMe.
                        externalId:
                          anyOf:
                            - type: string
                            - type: "null"
                        error:
                          anyOf:
                            - type: string
                            - type: "null"
                        interlocutor:
                          type: string
                          description: "Meaning depends on direction and isGroup. 1:1 chat: the other party's phone number, both directions. Group + direction IN: the participant who posted the message. Group + direction OUT: the group's own bare id, since an outbound message's author is always the account holder (never the account holder's own number). For who a reply specifically targets, see replyToParticipant instead."
                        conversationId:
                          anyOf:
                            - type: string
                            - type: "null"
                        isGroup:
                          type: boolean
                        replyToExternalId:
                          anyOf:
                            - type: string
                            - type: "null"
                          description: The externalId of the message this one quotes as a reply, or null if it isn't a reply.
                        replyToParticipant:
                          anyOf:
                            - type: string
                            - type: "null"
                          description: For a reply to a group message, the phone number of whoever posted the message being replied to - not necessarily the same as interlocutor. Null outside that case.
                        retryCount:
                          type: integer
                          minimum: 0
                          maximum: 9007199254740991
                        messagingAccountId:
                          type: string
                        status:
                          type: string
                          enum:
                            - PENDING
                            - SENDING
                            - SENT
                            - DELIVERED
                            - READ
                            - FAILED
                            - UNDELIVERABLE
                        channel:
                          type: string
                          enum:
                            - WHATSAPP
                            - SMS
                            - EMAIL
                        accountChannel:
                          type: string
                          enum:
                            - WHATSAPP_BAILYES
                            - EMAIL
                            - SMS
                            - WHATSAPP_WHATSMEOW
                        watermarked:
                          type: boolean
                          description: Whether the "Sent with UnlimitedMessaging.app" line was appended. Never on the paid plans (Medium, Max), nor on media and product messages; on the Free plan, text messages only.
                        mediaUrl:
                          anyOf:
                            - type: string
                            - type: "null"
                        mediaType:
                          anyOf:
                            - type: string
                            - type: "null"
                        mimeType:
                          anyOf:
                            - type: string
                            - type: "null"
                        mediaFilename:
                          anyOf:
                            - type: string
                            - type: "null"
                        transcript:
                          anyOf:
                            - type: string
                            - type: "null"
                          description: "Text extracted from the media: OCR of an image or a scanned PDF, the text of a PDF, a voice note's transcription. Not produced yet: always null for now."
                        productData:
                          anyOf:
                            - type: object
                              propertyNames:
                                type: string
                              additionalProperties: {}
                            - type: "null"
                        sentAt:
                          anyOf:
                            - type: string
                              format: date-time
                              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                            - type: "null"
                          description: "When the message was sent, per the channel: WhatsApp's own timestamp for a received message or one typed on the phone, the moment it went out for one sent through the API. Order conversations on this rather than createdAt. Null until an API send goes out."
                        deletedAt:
                          anyOf:
                            - type: string
                              format: date-time
                              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                            - type: "null"
                          description: When the message was deleted for everyone, null if it was not.
                        createdAt:
                          type: string
                          format: date-time
                          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                        updatedAt:
                          type: string
                          format: date-time
                          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                      required:
                        - id
                        - content
                        - direction
                        - fromMe
                        - externalId
                        - error
                        - interlocutor
                        - conversationId
                        - isGroup
                        - replyToExternalId
                        - replyToParticipant
                        - retryCount
                        - messagingAccountId
                        - status
                        - channel
                        - accountChannel
                        - watermarked
                        - mediaUrl
                        - mediaType
                        - mimeType
                        - mediaFilename
                        - transcript
                        - productData
                        - sentAt
                        - deletedAt
                        - createdAt
                        - updatedAt
                      additionalProperties: false
                  total:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                  page:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                  limit:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                  totalPages:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                required:
                  - data
                  - total
                  - page
                  - limit
                  - totalPages
                additionalProperties: false
          description: ""
        "400":
          description: Invalid request parameters or body.
        "401":
          description: Missing or invalid authentication credentials.
        "403":
          description: Insufficient permissions to access this resource.
      security:
        - bearer: []
      summary: List messages with pagination and filters.
      tags:
        - Messages
    post:
      description: |-
        **Protection**: Protected endpoint. Allowed roles: USER, ADMIN. Required scopes: OTHER:WRITE

        Queues a WhatsApp message for delivery to the specified `recipient`: a phone number (E.164 format) for a 1:1 chat, or a WhatsApp group id (numeric, with or without its `@g.us` suffix) to address a group directly. If `accountId` is omitted, the platform resolves an account automatically using this priority order: (1) if the caller has exactly one active account, it is used; (2) if the caller has no account, the shared system account is used as fallback; (3) if the caller has multiple active accounts, a `400` is returned asking to specify `accountId`. Returns `404` if no account is available at all. Message text is limited to 1 600 characters. Provide `replyToMessageId` instead of `recipient` to send a quoted reply to a message already in the account's history: the conversation (a group included) and the account used are both derived from that message, and `accountId` is ignored. Beta (whatsmeow) WhatsApp accounts only for now. `simId` is a deprecated alias for `accountId`, removed 2026-12-16. To send a media file, upload it first with `POST /media` to get a temp URL, then pass that URL as `mediaUrl` with the matching `mediaType` (`image`, `document`, or `audio`) in this body. Watermark: on the paid plans (Medium, Max) nothing is ever added to your messages. On the Free plan, a text message ends with a "Sent with UnlimitedMessaging.app" line; media and product messages never do. `watermarked` on the message says whether it was added.
      operationId: Message_send
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                recipient:
                  type: string
                  minLength: 1
                text:
                  type: string
                  minLength: 1
                  maxLength: 1600
                mediaUrl:
                  type: string
                  format: uri
                mediaType:
                  type: string
                  enum:
                    - image
                    - document
                    - audio
                mimeType:
                  type: string
                filename:
                  type: string
                priority:
                  description: "`transactional` (an invoice, a reminder) is sent before any `normal` message already waiting in the queue, so a bulk send does not delay it. The pause between two sends of an account still applies. Defaults to `normal`."
                  type: string
                  enum:
                    - normal
                    - transactional
                compress:
                  description: Images are always delivered to WhatsApp as uploaded. The copy UnlimitedMessaging keeps (what `mediaUrl` serves back) is resized and converted to WebP by default; set `false` to keep it byte-for-byte, e.g. for images with fine text. PNGs under 1 MB are always kept as is.
                  type: boolean
                productData:
                  type: object
                  properties:
                    productId:
                      type: string
                      minLength: 1
                    title:
                      type: string
                      minLength: 1
                      maxLength: 200
                    description:
                      type: string
                      maxLength: 500
                    currencyCode:
                      type: string
                      minLength: 3
                      maxLength: 3
                    priceAmount1000:
                      type: integer
                      minimum: 0
                      maximum: 9007199254740991
                    salePriceAmount1000:
                      type: integer
                      minimum: 0
                      maximum: 9007199254740991
                    retailerId:
                      type: string
                    url:
                      type: string
                    imageUrl:
                      type: string
                    businessOwnerJid:
                      type: string
                      minLength: 1
                    body:
                      type: string
                      maxLength: 1600
                    footer:
                      type: string
                      maxLength: 60
                  required:
                    - productId
                    - title
                    - currencyCode
                    - priceAmount1000
                    - businessOwnerJid
                accountId:
                  anyOf:
                    - type: string
                    - type: "null"
                simId:
                  anyOf:
                    - type: string
                    - type: "null"
                replyToMessageId:
                  type: string
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  content:
                    anyOf:
                      - type: string
                      - type: "null"
                  direction:
                    type: string
                    enum:
                      - IN
                      - OUT
                  fromMe:
                    type: boolean
                    description: True when the account holder sent this message (direction OUT), false when they received it (direction IN). Redundant with direction, but spares the client from having to know which enum value means "we sent it" - the same convention as WhatsApp's own fromMe.
                  externalId:
                    anyOf:
                      - type: string
                      - type: "null"
                  error:
                    anyOf:
                      - type: string
                      - type: "null"
                  interlocutor:
                    type: string
                    description: "Meaning depends on direction and isGroup. 1:1 chat: the other party's phone number, both directions. Group + direction IN: the participant who posted the message. Group + direction OUT: the group's own bare id, since an outbound message's author is always the account holder (never the account holder's own number). For who a reply specifically targets, see replyToParticipant instead."
                  conversationId:
                    anyOf:
                      - type: string
                      - type: "null"
                  isGroup:
                    type: boolean
                  replyToExternalId:
                    anyOf:
                      - type: string
                      - type: "null"
                    description: The externalId of the message this one quotes as a reply, or null if it isn't a reply.
                  replyToParticipant:
                    anyOf:
                      - type: string
                      - type: "null"
                    description: For a reply to a group message, the phone number of whoever posted the message being replied to - not necessarily the same as interlocutor. Null outside that case.
                  retryCount:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                  messagingAccountId:
                    type: string
                  status:
                    type: string
                    enum:
                      - PENDING
                      - SENDING
                      - SENT
                      - DELIVERED
                      - READ
                      - FAILED
                      - UNDELIVERABLE
                  channel:
                    type: string
                    enum:
                      - WHATSAPP
                      - SMS
                      - EMAIL
                  accountChannel:
                    type: string
                    enum:
                      - WHATSAPP_BAILYES
                      - EMAIL
                      - SMS
                      - WHATSAPP_WHATSMEOW
                  watermarked:
                    type: boolean
                    description: Whether the "Sent with UnlimitedMessaging.app" line was appended. Never on the paid plans (Medium, Max), nor on media and product messages; on the Free plan, text messages only.
                  mediaUrl:
                    anyOf:
                      - type: string
                      - type: "null"
                  mediaType:
                    anyOf:
                      - type: string
                      - type: "null"
                  mimeType:
                    anyOf:
                      - type: string
                      - type: "null"
                  mediaFilename:
                    anyOf:
                      - type: string
                      - type: "null"
                  transcript:
                    anyOf:
                      - type: string
                      - type: "null"
                    description: "Text extracted from the media: OCR of an image or a scanned PDF, the text of a PDF, a voice note's transcription. Not produced yet: always null for now."
                  productData:
                    anyOf:
                      - type: object
                        propertyNames:
                          type: string
                        additionalProperties: {}
                      - type: "null"
                  sentAt:
                    anyOf:
                      - type: string
                        format: date-time
                        pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                      - type: "null"
                    description: "When the message was sent, per the channel: WhatsApp's own timestamp for a received message or one typed on the phone, the moment it went out for one sent through the API. Order conversations on this rather than createdAt. Null until an API send goes out."
                  deletedAt:
                    anyOf:
                      - type: string
                        format: date-time
                        pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                      - type: "null"
                    description: When the message was deleted for everyone, null if it was not.
                  createdAt:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                  updatedAt:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                required:
                  - id
                  - content
                  - direction
                  - fromMe
                  - externalId
                  - error
                  - interlocutor
                  - conversationId
                  - isGroup
                  - replyToExternalId
                  - replyToParticipant
                  - retryCount
                  - messagingAccountId
                  - status
                  - channel
                  - accountChannel
                  - watermarked
                  - mediaUrl
                  - mediaType
                  - mimeType
                  - mediaFilename
                  - transcript
                  - productData
                  - sentAt
                  - deletedAt
                  - createdAt
                  - updatedAt
                additionalProperties: false
          description: ""
        "400":
          description: Invalid request parameters or body.
        "401":
          description: Missing or invalid authentication credentials.
        "403":
          description: Insufficient permissions to access this resource.
        "404":
          description: The requested resource was not found.
        "409":
          description: A resource with the same identifier already exists.
        "422":
          description: The request could not be processed.
      security:
        - bearer: []
      summary: Send a WhatsApp message.
      tags:
        - Messages
  /message/{id}:
    get:
      description: |-
        **Protection**: Protected endpoint. Allowed roles: USER, ADMIN. Required scopes: OTHER:READ

