x-webhooks:
  message.received:
    post:
      tags:
        - Webhook Events
      summary: An inbound message arrived on one of your accounts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEventMessageReceived"
      responses:
        "200":
          description: Return any 2xx to acknowledge the delivery.
  message.self_sent:
    post:
      tags:
        - Webhook Events
      summary: The account's own phone sent a message by hand, outside the API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEventMessageSelfSent"
      responses:
        "200":
          description: Return any 2xx to acknowledge the delivery.
  message.sent:
    post:
      tags:
        - Webhook Events
      summary: A message you sent through the API reached the channel.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEventMessageSent"
      responses:
        "200":
          description: Return any 2xx to acknowledge the delivery.
  message.status:
    post:
      tags:
        - Webhook Events
      summary: An outbound message changed status (SENT, DELIVERED, READ, FAILED...).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEventMessageStatus"
      responses:
        "200":
          description: Return any 2xx to acknowledge the delivery.
  message.reaction:
    post:
