        - Webhook Events
      summary: Someone reacted to a message, or removed their reaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEventMessageReaction"
      responses:
        "200":
          description: Return any 2xx to acknowledge the delivery.
  message.edited:
