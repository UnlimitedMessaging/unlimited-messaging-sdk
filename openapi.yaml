  /account/link:
    get:
      description: |-
        **Protection**: Protected endpoint. Allowed roles: USER, ADMIN. Required scopes: OTHER:READ, OTHER:WRITE

        Creates a new account in Linking status and starts a WhatsApp session. Poll GET /account/:accountId/challenge every second to get the QR code to scan. `mode` picks the connection method: `stable` (default) is the long-standing one, `beta` is newer and keeps the connection alive noticeably better. A pending attempt is resumed rather than duplicated. When you link numbers on behalf of several customers, pass `externalRef` (your own id for the customer, stored on the account and returned with it) so only that customer's pending attempt is resumed, or `new=true` to always start a fresh one.
      operationId: Account_link_account
      parameters:
        - name: mode
          required: false
          in: query
          schema:
            default: stable
            type: string
            enum:
              - stable
              - beta
        - name: new
          required: false
          in: query
          schema:
            description: Always start a new linking attempt, even if one is already pending. Other pending attempts are left alone.
            type: boolean
        - name: syncHistory
          required: false
          in: query
          schema:
            description: "Receive the account's message history: its past conversations are stored and announced as `message.history` webhook batches once the number is linked. Beta (whatsmeow) accounts only. Defaults to false."
            type: boolean
        - name: externalRef
          required: false
          in: query
          schema:
            description: Your own reference for this account (e.g. your customer organization id), stored on it. Only a pending attempt made with the same reference is resumed, so two of your customers linking at the same time each get their own account.
            type: string
            minLength: 1
            maxLength: 200
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  accountId:
                    type: string
                required:
                  - accountId
                additionalProperties: false
          description: ""
        "401":
          description: Missing or invalid authentication credentials.
        "403":
          description: Insufficient permissions to access this resource.
        "503":
          description: The service needed to satisfy this request is not available right now.
      security:
        - bearer: []
      summary: Start a WhatsApp linking session.
      tags:
        - Accounts
