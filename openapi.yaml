      summary: A message was edited by its author.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEventMessageEdited"
      responses:
        "200":
          description: Return any 2xx to acknowledge the delivery.
  message.deleted:
    post:
      tags:
        - Webhook Events
      summary: A message was deleted for everyone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEventMessageDeleted"
      responses:
        "200":
          description: Return any 2xx to acknowledge the delivery.
  message.history:
    post:
      tags:
        - Webhook Events
      summary: A batch of past messages from an account's history sync.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEventMessageHistory"
      responses:
        "200":
          description: Return any 2xx to acknowledge the delivery.
  account.status_changed:
    post:
      tags:
        - Webhook Events
      summary: An account's connection status changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEventAccountStatusChanged"
      responses:
        "200":
          description: Return any 2xx to acknowledge the delivery.
  group.updated:
    post:
      tags:
        - Webhook Events
      summary: A group the account is in changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEventGroupUpdated"
      responses:
        "200":
          description: Return any 2xx to acknowledge the delivery.
