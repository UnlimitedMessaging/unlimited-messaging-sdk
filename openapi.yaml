openapi: 3.0.0
paths:
  /message:
    get:
      description: |-
        **Protection**: Protected endpoint. Allowed roles: USER, ADMIN. Required scopes: OTHER:READ

        Returns a paginated list of messages for the authenticated user. Supports filtering by `status`, `messagingAccountId`, and free-text `search`. Results are ordered by creation date (most recent first). Use `page` (default 1) and `limit` (1–100, default 20) to paginate.
      operationId: Message_find_all
      parameters:
        - name: page
          required: false
          in: query
          schema:
            default: 1
            type: integer
            minimum: 1
            maximum: 9007199254740991
        - name: limit
          required: false
          in: query
          schema:
            default: 20
            type: integer
            minimum: 1
            maximum: 100
        - name: channel
          required: false
          in: query
          schema:
            type: string
            enum:
              - WHATSAPP
              - SMS
              - EMAIL
        - name: status
          required: false
          in: query
          schema:
            type: string
            enum:
              - PENDING
              - SENDING
              - SENT
              - DELIVERED
              - READ
              - FAILED
              - UNDELIVERABLE
        - name: direction
          required: false
          in: query
          schema:
            type: string
            enum:
              - IN
              - OUT
        - name: messagingAccountId
          required: false
          in: query
          schema:
            type: string
        - name: search
          required: false
          in: query
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        content:
                          type: string
                        direction:
                          type: string
                          enum:
                            - IN
                            - OUT
                        externalId:
                          anyOf:
                            - type: string
                            - type: "null"
                        error:
                          anyOf:
                            - type: string
                            - type: "null"
                        interlocutor:
                          type: string
                        retryCount:
                          type: integer
                          minimum: 0
                          maximum: 9007199254740991
                        messagingAccountId:
                          type: string
                        status:
                          type: string
                          enum:
                            - PENDING
                            - SENDING
                            - SENT
                            - DELIVERED
                            - READ
                            - FAILED
                            - UNDELIVERABLE
                        channel:
                          type: string
                          enum:
                            - WHATSAPP
                            - SMS
                            - EMAIL
                        accountChannel:
                          type: string
                          enum:
                            - WHATSAPP_BAILYES
                            - EMAIL
                            - SMS
                            - WHATSAPP_WHATSMEOW
                        watermarked:
                          type: boolean
                        createdAt:
                          type: string
                          format: date-time
                          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                        updatedAt:
                          type: string
                          format: date-time
                          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                      required:
                        - id
                        - content
                        - direction
                        - externalId
                        - error
                        - interlocutor
                        - retryCount
                        - messagingAccountId
                        - status
                        - channel
                        - accountChannel
                        - watermarked
                        - createdAt
                        - updatedAt
                      additionalProperties: false
                  total:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                  page:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                  limit:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                  totalPages:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                required:
                  - data
                  - total
                  - page
                  - limit
                  - totalPages
                additionalProperties: false
          description: ""
        "400":
          description: Invalid request parameters or body.
        "401":
          description: Missing or invalid authentication credentials.
        "403":
          description: Insufficient permissions to access this resource.
      security:
        - bearer: []
      summary: List messages with pagination and filters.
      tags:
        - Messages
    post:
      description: |-
        **Protection**: Protected endpoint. Allowed roles: USER, ADMIN. Required scopes: OTHER:WRITE

        Queues a WhatsApp message for delivery to the specified `recipient` phone number (E.164 format). If `accountId` is omitted, the platform resolves an account automatically using this priority order: (1) if the caller has exactly one active account, it is used; (2) if the caller has no account, the shared system account is used as fallback; (3) if the caller has multiple active accounts, a `400` is returned asking to specify `accountId`. Returns `404` if no account is available at all. Message text is limited to 1 600 characters.
      operationId: Message_send
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                recipient:
                  type: string
                  minLength: 1
                text:
                  type: string
                  minLength: 1
                  maxLength: 1600
                accountId:
                  anyOf:
                    - type: string
                    - type: "null"
              required:
                - recipient
                - text
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  content:
                    type: string
                  direction:
                    type: string
                    enum:
                      - IN
                      - OUT
                  externalId:
                    anyOf:
                      - type: string
                      - type: "null"
                  error:
                    anyOf:
                      - type: string
                      - type: "null"
                  interlocutor:
                    type: string
                  retryCount:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                  messagingAccountId:
                    type: string
                  status:
                    type: string
                    enum:
                      - PENDING
                      - SENDING
                      - SENT
                      - DELIVERED
                      - READ
                      - FAILED
                      - UNDELIVERABLE
                  channel:
                    type: string
                    enum:
                      - WHATSAPP
                      - SMS
                      - EMAIL
                  accountChannel:
                    type: string
                    enum:
                      - WHATSAPP_BAILYES
                      - EMAIL
                      - SMS
                      - WHATSAPP_WHATSMEOW
                  watermarked:
                    type: boolean
                  createdAt:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                  updatedAt:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                required:
                  - id
                  - content
                  - direction
                  - externalId
                  - error
                  - interlocutor
                  - retryCount
                  - messagingAccountId
                  - status
                  - channel
                  - accountChannel
                  - watermarked
                  - createdAt
                  - updatedAt
                additionalProperties: false
          description: ""
        "400":
          description: Invalid request parameters or body.
        "401":
          description: Missing or invalid authentication credentials.
        "403":
          description: Insufficient permissions to access this resource.
        "404":
          description: The requested resource was not found.
        "422":
          description: The request could not be processed.
      security:
        - bearer: []
      summary: Send a WhatsApp message.
      tags:
        - Messages
  /message/{id}:
    get:
      description: |-
        **Protection**: Protected endpoint. Allowed roles: USER, ADMIN. Required scopes: OTHER:READ

        Returns a single message by its unique identifier. Returns 404 if the message is not found or does not belong to the authenticated user.
      operationId: Message_find_one
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  content:
                    type: string
                  direction:
                    type: string
                    enum:
                      - IN
                      - OUT
                  externalId:
                    anyOf:
                      - type: string
                      - type: "null"
                  error:
                    anyOf:
                      - type: string
                      - type: "null"
                  interlocutor:
                    type: string
                  retryCount:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                  messagingAccountId:
                    type: string
                  status:
                    type: string
                    enum:
                      - PENDING
                      - SENDING
                      - SENT
                      - DELIVERED
                      - READ
                      - FAILED
                      - UNDELIVERABLE
                  channel:
                    type: string
                    enum:
                      - WHATSAPP
                      - SMS
                      - EMAIL
                  accountChannel:
                    type: string
                    enum:
                      - WHATSAPP_BAILYES
                      - EMAIL
                      - SMS
                      - WHATSAPP_WHATSMEOW
                  watermarked:
                    type: boolean
                  createdAt:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                  updatedAt:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                required:
                  - id
                  - content
                  - direction
                  - externalId
                  - error
                  - interlocutor
                  - retryCount
                  - messagingAccountId
                  - status
                  - channel
                  - accountChannel
                  - watermarked
                  - createdAt
                  - updatedAt
                additionalProperties: false
          description: ""
        "401":
          description: Missing or invalid authentication credentials.
        "403":
          description: Insufficient permissions to access this resource.
        "404":
          description: The requested resource was not found.
      security:
        - bearer: []
      summary: Get a message by ID.
      tags:
        - Messages
  /message/{id}/status-history:
    get:
      description: |-
        **Protection**: Protected endpoint. Allowed roles: USER, ADMIN. Required scopes: OTHER:READ

        Returns every recorded status event per channel for a message owned by the authenticated user, flagging which ones advanced the denormalized current status (out-of-order acks stay non-effective). Returns 404 if the message is not found or does not belong to the authenticated user.
      operationId: Message_get_status_history
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  messageId:
                    type: string
                  channels:
                    type: array
                    items:
                      type: object
                      properties:
                        messageChannelId:
                          type: string
                        channel:
                          type: string
                          enum:
                            - WHATSAPP
                            - SMS
                            - EMAIL
                        error:
                          anyOf:
                            - type: string
                            - type: "null"
                        events:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                              status:
                                type: string
                                enum:
                                  - PENDING
                                  - SENDING
                                  - SENT
                                  - DELIVERED
                                  - READ
                                  - FAILED
                                  - UNDELIVERABLE
                              createdAt:
                                type: string
                                format: date-time
                                pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                            required:
                              - id
                              - status
                              - createdAt
                            additionalProperties: false
                      required:
                        - messageChannelId
                        - channel
                        - error
                        - events
                      additionalProperties: false
                required:
                  - messageId
                  - channels
                additionalProperties: false
          description: ""
        "401":
          description: Missing or invalid authentication credentials.
        "403":
          description: Insufficient permissions to access this resource.
        "404":
          description: The requested resource was not found.
      security:
        - bearer: []
      summary: Status timeline for a message.
      tags:
        - Messages
  /account:
    get:
      description: |-
        **Protection**: Protected endpoint. Allowed roles: USER, ADMIN. Required scopes: OTHER:READ, OTHER:WRITE

        Returns all active messaging accounts linked to the authenticated user's account. Deactivated accounts are excluded from the response.
      operationId: Account_list_accounts
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    channel:
                      type: string
                      enum:
                        - WHATSAPP_BAILYES
                        - EMAIL
                        - SMS
                        - WHATSAPP_WHATSMEOW
                    isSystem:
                      type: boolean
                    status:
                      type: string
                      enum:
                        - PENDING
                        - ACTIVE
                        - INACTIVE
                        - LINKING
                        - BLOCKED
                        - DUPLICATE
                    phone:
                      anyOf:
                        - type: string
                        - type: "null"
                    name:
                      anyOf:
                        - type: string
                        - type: "null"
                    blockedUntil:
                      anyOf:
                        - type: string
                          format: date-time
                          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                        - type: "null"
                    createdAt:
                      type: string
                      format: date-time
                      pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                    updatedAt:
                      type: string
                      format: date-time
                      pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                  required:
                    - id
                    - channel
                    - isSystem
                    - status
                    - phone
                    - name
                    - blockedUntil
                    - createdAt
                    - updatedAt
                  additionalProperties: false
          description: ""
        "401":
          description: Missing or invalid authentication credentials.
        "403":
          description: Insufficient permissions to access this resource.
      security:
        - bearer: []
      summary: List active accounts.
      tags:
        - Accounts
  /account/link:
    get:
      description: |-
        **Protection**: Protected endpoint. Allowed roles: USER, ADMIN. Required scopes: OTHER:READ, OTHER:WRITE

        Creates a new account in Linking status and starts a WhatsApp session. Poll GET /account/:accountId/challenge every second to get the QR code to scan. `mode` picks the connection method: `stable` (default) is the long-standing one, `beta` is newer and keeps the connection alive noticeably better.
      operationId: Account_link_account
      parameters:
        - name: mode
          required: false
          in: query
          schema:
            default: stable
            type: string
            enum:
              - stable
              - beta
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  accountId:
                    type: string
                required:
                  - accountId
                additionalProperties: false
          description: ""
        "401":
          description: Missing or invalid authentication credentials.
        "403":
          description: Insufficient permissions to access this resource.
        "503":
          description: The service needed to satisfy this request is not available right now.
      security:
        - bearer: []
      summary: Start a WhatsApp linking session.
      tags:
        - Accounts
  /account/{accountId}/challenge:
    get:
      description: |-
        **Protection**: Protected endpoint. Allowed roles: USER, ADMIN. Required scopes: OTHER:READ, OTHER:WRITE

        Returns whatever the account still needs to finish connecting - a QR code, a short code, a redirect, or nothing for a channel that connects from credentials alone. Poll every second while the account is in Linking status. Returns null once there is nothing left to do.
      operationId: Account_get_challenge
      parameters:
        - name: accountId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  challenge:
                    anyOf:
                      - oneOf:
                          - type: object
                            properties:
                              kind:
                                type: string
                                const: qr
                              data:
                                type: string
                              expiresAt:
                                type: string
                                format: date-time
                                pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                            required:
                              - kind
                              - data
                            additionalProperties: false
                          - type: object
                            properties:
                              kind:
                                type: string
                                const: code
                              data:
                                type: string
                            required:
                              - kind
                              - data
                            additionalProperties: false
                          - type: object
                            properties:
                              kind:
                                type: string
                                const: redirect
                              url:
                                type: string
                            required:
                              - kind
                              - url
                            additionalProperties: false
                          - type: object
                            properties:
                              kind:
                                type: string
                                const: none
                            required:
                              - kind
                            additionalProperties: false
                      - type: "null"
                required:
                  - challenge
                additionalProperties: false
          description: ""
        "401":
          description: Missing or invalid authentication credentials.
        "403":
          description: Insufficient permissions to access this resource.
        "404":
          description: The requested resource was not found.
      security:
        - bearer: []
      summary: Get the pending connection challenge for an account, if any.
      tags:
        - Accounts
  /account/{accountId}/qrcode:
    get:
      deprecated: true
      description: |-
        **Protection**: Protected endpoint. Allowed roles: USER, ADMIN. Required scopes: OTHER:READ, OTHER:WRITE

        Deprecated: use GET /account/:accountId/challenge instead, which returns a channel-agnostic `challenge` object rather than a WhatsApp-specific `qrCode` string. This route is removed on 2026-12-16.

        Returns the latest QR code for an account in Linking status. Poll every second until a QR code is available, then display it. Returns null if the QR is not yet ready.
      operationId: Account_get_qr_code
      parameters:
        - name: accountId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  qrCode:
                    anyOf:
                      - type: string
                      - type: "null"
                required:
                  - qrCode
                additionalProperties: false
          description: ""
        "401":
          description: Missing or invalid authentication credentials.
        "403":
          description: Insufficient permissions to access this resource.
        "404":
          description: The requested resource was not found.
      security:
        - bearer: []
      summary: Get the current QR code for an account.
      tags:
        - Accounts
  /account/{accountId}:
    get:
      description: |-
        **Protection**: Protected endpoint. Allowed roles: USER, ADMIN. Required scopes: OTHER:READ, OTHER:WRITE

        Returns the current state of an account including its status. Use this to poll during the linking flow (LINKING -> ACTIVE).
      operationId: Account_get_account
      parameters:
        - name: accountId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  channel:
                    type: string
                    enum:
                      - WHATSAPP_BAILYES
                      - EMAIL
                      - SMS
                      - WHATSAPP_WHATSMEOW
                  isSystem:
                    type: boolean
                  status:
                    type: string
                    enum:
                      - PENDING
                      - ACTIVE
                      - INACTIVE
                      - LINKING
                      - BLOCKED
                      - DUPLICATE
                  phone:
                    anyOf:
                      - type: string
                      - type: "null"
                  name:
                    anyOf:
                      - type: string
                      - type: "null"
                  blockedUntil:
                    anyOf:
                      - type: string
                        format: date-time
                        pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                      - type: "null"
                  createdAt:
