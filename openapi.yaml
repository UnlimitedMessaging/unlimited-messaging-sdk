openapi: 3.0.0
paths:
  /media:
    post:
      description: |-
        **Protection**: Protected endpoint. Allowed roles: USER, ADMIN. Required scopes: OTHER:WRITE

        Uploads a media file and returns a temporary URL valid for 10 minutes. Pass that URL as `mediaUrl` in `POST /message` to send it as a WhatsApp message. Accepted types: images (`image/jpeg`, `image/png`, `image/webp`, `image/gif`), documents (`application/pdf`), and audio (`audio/webm`, `audio/ogg`, `audio/mpeg`, `audio/mp4`, `audio/aac`). Maximum file size: 16 MB. Audio files from browsers (WebM/Opus recorded via the MediaRecorder API) are automatically transcoded to OGG/Opus and delivered as WhatsApp voice notes (PTT) when sent via `POST /message`.
      operationId: Media_upload
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: "Media file to upload. Accepted: image/jpeg, image/png, image/webp, image/gif, application/pdf, audio/ogg, audio/webm, audio/mpeg, audio/mp4, audio/aac. Max 16 MB."
              required:
                - file
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                  mimeType:
                    type: string
                  filename:
                    type: string
                required:
                  - url
                  - mimeType
                additionalProperties: false
          description: ""
        "400":
          description: Invalid request parameters or body.
        "401":
          description: Missing or invalid authentication credentials.
        "403":
          description: Insufficient permissions to access this resource.
      security:
        - bearer: []
      summary: Upload a media file.
      tags:
        - Media
  /message:
    get:
      description: |-
        **Protection**: Protected endpoint. Allowed roles: USER, ADMIN. Required scopes: OTHER:READ

        Returns a paginated list of messages for the authenticated user. Supports filtering by `status`, `messagingAccountId`, and free-text `search`. Results are ordered by creation date (most recent first). Use `page` (default 1) and `limit` (1-100, default 20) to paginate. `simId` is a deprecated alias for `messagingAccountId`, removed 2026-12-16.
      operationId: Message_find_all
      parameters:
        - name: page
          required: false
          in: query
          schema:
            default: 1
            type: integer
            minimum: 1
            maximum: 9007199254740991
        - name: limit
          required: false
          in: query
          schema:
            default: 20
            type: integer
            minimum: 1
            maximum: 100
        - name: channel
          required: false
          in: query
          schema:
            type: string
            enum:
              - WHATSAPP
              - SMS
              - EMAIL
        - name: status
          required: false
          in: query
          schema:
            type: string
            enum:
              - PENDING
              - SENDING
              - SENT
              - DELIVERED
              - READ
              - FAILED
              - UNDELIVERABLE
        - name: direction
          required: false
          in: query
          schema:
            type: string
            enum:
              - IN
              - OUT
        - name: messagingAccountId
          required: false
          in: query
          schema:
            type: string
        - name: simId
          required: false
          in: query
          schema:
            type: string
        - name: search
          required: false
          in: query
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        content:
                          anyOf:
                            - type: string
                            - type: "null"
                        direction:
                          type: string
                          enum:
                            - IN
                            - OUT
                        fromMe:
                          type: boolean
                          description: True when the account holder sent this message (direction OUT), false when they received it (direction IN). Redundant with direction, but spares the client from having to know which enum value means "we sent it" - the same convention as WhatsApp's own fromMe.
                        externalId:
                          anyOf:
                            - type: string
                            - type: "null"
                        error:
                          anyOf:
                            - type: string
                            - type: "null"
                        interlocutor:
                          type: string
                          description: "Meaning depends on direction and isGroup. 1:1 chat: the other party's phone number, both directions. Group + direction IN: the participant who posted the message. Group + direction OUT: the group's own bare id, since an outbound message's author is always the account holder (never the account holder's own number). For who a reply specifically targets, see replyToParticipant instead."
                        conversationId:
                          anyOf:
                            - type: string
                            - type: "null"
                        isGroup:
                          type: boolean
                        replyToExternalId:
                          anyOf:
                            - type: string
                            - type: "null"
                          description: The externalId of the message this one quotes as a reply, or null if it isn't a reply.
                        replyToParticipant:
                          anyOf:
                            - type: string
                            - type: "null"
                          description: For a reply to a group message, the phone number of whoever posted the message being replied to - not necessarily the same as interlocutor. Null outside that case.
                        retryCount:
                          type: integer
                          minimum: 0
                          maximum: 9007199254740991
                        messagingAccountId:
                          type: string
                        status:
                          type: string
                          enum:
                            - PENDING
                            - SENDING
                            - SENT
                            - DELIVERED
                            - READ
                            - FAILED
                            - UNDELIVERABLE
                        channel:
                          type: string
                          enum:
                            - WHATSAPP
                            - SMS
                            - EMAIL
                        accountChannel:
                          type: string
                          enum:
                            - WHATSAPP_BAILYES
                            - EMAIL
                            - SMS
                            - WHATSAPP_WHATSMEOW
                        watermarked:
                          type: boolean
                          description: Whether the "Sent with UnlimitedMessaging.app" line was appended. Never on the paid plans (Medium, Max), nor on media and product messages; on the Free plan, text messages and emails only.
                        subject:
                          anyOf:
                            - type: string
                            - type: "null"
                          description: The email subject. Null on channels without one.
                        contentHtml:
                          anyOf:
                            - type: string
                            - type: "null"
                          description: "The rich body, as sent or received. Untrusted for an inbound message: sanitise before rendering."
                        dispatchId:
                          anyOf:
                            - type: string
                            - type: "null"
                          description: Ties together the messages one send request created, one per channel. Null for inbound messages.
                        attachments:
                          type: array
                          items:
                            type: object
                            properties:
                              url:
                                type: string
                              filename:
                                anyOf:
                                  - type: string
                                  - type: "null"
                              mimeType:
                                type: string
                              size:
                                type: integer
                                minimum: 0
                                maximum: 9007199254740991
                              contentId:
                                anyOf:
                                  - type: string
                                  - type: "null"
                                description: Set for an inline image the HTML body references as cid:<contentId>.
                            required:
                              - url
                              - filename
                              - mimeType
                              - size
                              - contentId
                            additionalProperties: false
                        mediaUrl:
                          anyOf:
                            - type: string
                            - type: "null"
                          deprecated: true
                          description: "Deprecated: use `attachments` instead (this is the first one)."
                        mediaType:
                          anyOf:
                            - type: string
                            - type: "null"
                          deprecated: true
                          description: "Deprecated: use `attachments` instead (this is the first one)."
                        mimeType:
                          anyOf:
                            - type: string
                            - type: "null"
                          deprecated: true
                          description: "Deprecated: use `attachments` instead (this is the first one)."
                        mediaFilename:
                          anyOf:
                            - type: string
                            - type: "null"
                          deprecated: true
                          description: "Deprecated: use `attachments` instead (this is the first one)."
                        transcript:
                          anyOf:
                            - type: string
                            - type: "null"
                          description: "Text extracted from the media: OCR of an image or a scanned PDF, the text of a PDF, a voice note's transcription. Not produced yet: always null for now."
                        productData:
                          anyOf:
                            - type: object
                              propertyNames:
                                type: string
                              additionalProperties: {}
                            - type: "null"
                        sentAt:
                          anyOf:
                            - type: string
                              format: date-time
                              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                            - type: "null"
                          description: "When the message was sent, per the channel: WhatsApp's own timestamp for a received message or one typed on the phone, the moment it went out for one sent through the API. Order conversations on this rather than createdAt. Null until an API send goes out."
                        deletedAt:
                          anyOf:
                            - type: string
                              format: date-time
                              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                            - type: "null"
                          description: When the message was deleted for everyone, null if it was not.
                        createdAt:
                          type: string
                          format: date-time
                          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                        updatedAt:
                          type: string
                          format: date-time
                          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                      required:
                        - id
                        - content
                        - direction
                        - fromMe
                        - externalId
                        - error
                        - interlocutor
                        - conversationId
                        - isGroup
                        - replyToExternalId
                        - replyToParticipant
                        - retryCount
                        - messagingAccountId
                        - status
                        - channel
                        - accountChannel
                        - watermarked
                        - subject
                        - contentHtml
                        - dispatchId
                        - attachments
                        - mediaUrl
                        - mediaType
                        - mimeType
                        - mediaFilename
                        - transcript
                        - productData
                        - sentAt
                        - deletedAt
                        - createdAt
                        - updatedAt
                      additionalProperties: false
                  total:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                  page:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                  limit:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                  totalPages:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                required:
                  - data
                  - total
                  - page
                  - limit
                  - totalPages
                additionalProperties: false
          description: ""
        "400":
          description: Invalid request parameters or body.
        "401":
          description: Missing or invalid authentication credentials.
        "403":
          description: Insufficient permissions to access this resource.
      security:
        - bearer: []
      summary: List messages with pagination and filters.
      tags:
        - Messages
    post:
      description: |-
        **Protection**: Protected endpoint. Allowed roles: USER, ADMIN. Required scopes: OTHER:WRITE

        **One channel:** set `recipient` to a phone number (E.164), a WhatsApp group id, or an email address. The channel follows from it (or from `accountId`). An email needs a `subject`.

        **Several channels at once:** set `to` (`phone`, `email`) and `channels`, e.g. `[{ "channel": "WHATSAPP" }, { "channel": "EMAIL", "subject": "Your code" }]`. One message is created per channel, each with its own status, all sharing the returned `dispatchId`; `messages` lists them all. A channel entry may override `text`, `html` and `subject`. WhatsApp gets `text`, or the `html` converted to plain text.

        **Accounts:** without `accountId` (or `channels[].accountId`), your only active account on that channel is used. With several, a `400` asks you to choose; with none, `404`.

        **Files:** upload with `POST /media` (or use any public URL) and list them in `attachments`. Email takes up to 20 (25 MB in total), WhatsApp one. `mediaUrl`/`mediaType`/`mimeType`/`filename` are deprecated in favour of `attachments`.

        **Replies:** `replyToMessageId` instead of `recipient` answers a message in the account's history, threaded on its conversation (WhatsApp beta accounts and email accounts).

        WhatsApp text is limited to 1 600 characters. `simId` is a deprecated alias for `accountId`, removed 2026-12-16.

        Watermark: on the paid plans (Medium, Max) nothing is ever added to your messages. On the Free plan, a text message (WhatsApp) or an email ends with a "Sent with UnlimitedMessaging.app" line; media and product messages never do. `watermarked` on the message says whether it was added.
      operationId: Message_send
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                recipient:
                  description: "Single-channel send: an email address, a phone number (E.164) or a WhatsApp group id. Use `to` with `channels` to send on several channels at once."
                  type: string
                  minLength: 1
                text:
                  type: string
                  minLength: 1
                  maxLength: 100000
                html:
                  type: string
                  minLength: 1
                  maxLength: 500000
                subject:
                  type: string
                  minLength: 1
                  maxLength: 998
                attachments:
                  maxItems: 20
                  type: array
                  items:
                    type: object
                    properties:
                      url:
                        type: string
                        format: uri
                      filename:
                        type: string
                        maxLength: 255
                      mimeType:
                        type: string
                        maxLength: 255
                      contentId:
                        type: string
                        maxLength: 255
                    required:
                      - url
                to:
                  type: object
                  properties:
                    phone:
                      type: string
                      minLength: 1
                    email:
                      type: string
                      format: email
                      pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                channels:
                  minItems: 1
                  maxItems: 3
                  type: array
                  items:
                    type: object
                    properties:
                      channel:
                        type: string
                        enum:
                          - WHATSAPP
                          - EMAIL
                          - SMS
                      accountId:
                        type: string
                      text:
                        type: string
                        minLength: 1
                        maxLength: 100000
                      html:
                        type: string
                        minLength: 1
                        maxLength: 500000
                      subject:
                        type: string
                        minLength: 1
                        maxLength: 998
                    required:
                      - channel
                mediaUrl:
                  deprecated: true
                  description: "Deprecated: use `attachments` instead."
                  type: string
                  format: uri
                mediaType:
                  deprecated: true
                  description: "Deprecated: use `attachments` instead (the type is derived from the MIME type)."
                  type: string
                  enum:
                    - image
                    - document
                    - audio
                mimeType:
                  deprecated: true
                  description: "Deprecated: use `attachments[].mimeType` instead."
                  type: string
                filename:
                  deprecated: true
                  description: "Deprecated: use `attachments[].filename` instead."
                  type: string
                priority:
                  description: "`transactional` (an invoice, a reminder) is sent before any `normal` message already waiting in the queue, so a bulk send does not delay it. The pause between two sends of an account still applies. Defaults to `normal`."
                  type: string
                  enum:
                    - normal
                    - transactional
                compress:
                  description: Images are always delivered to WhatsApp as uploaded. The copy UnlimitedMessaging keeps (what `mediaUrl` serves back) is resized and converted to WebP by default; set `false` to keep it byte-for-byte, e.g. for images with fine text. PNGs under 1 MB are always kept as is.
                  type: boolean
                productData:
                  type: object
                  properties:
                    productId:
                      type: string
                      minLength: 1
                    title:
                      type: string
                      minLength: 1
                      maxLength: 200
                    description:
                      type: string
                      maxLength: 500
                    currencyCode:
                      type: string
                      minLength: 3
                      maxLength: 3
                    priceAmount1000:
                      type: integer
                      minimum: 0
                      maximum: 9007199254740991
                    salePriceAmount1000:
                      type: integer
                      minimum: 0
                      maximum: 9007199254740991
                    retailerId:
                      type: string
                    url:
                      type: string
                    imageUrl:
                      type: string
                    businessOwnerJid:
                      type: string
                      minLength: 1
                    body:
                      type: string
                      maxLength: 1600
                    footer:
                      type: string
                      maxLength: 60
                  required:
                    - productId
                    - title
                    - currencyCode
                    - priceAmount1000
                    - businessOwnerJid
                accountId:
                  anyOf:
                    - type: string
                    - type: "null"
                simId:
                  anyOf:
                    - type: string
                    - type: "null"
                replyToMessageId:
                  type: string
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  content:
                    anyOf:
                      - type: string
                      - type: "null"
                  direction:
                    type: string
                    enum:
                      - IN
                      - OUT
                  fromMe:
                    type: boolean
                    description: True when the account holder sent this message (direction OUT), false when they received it (direction IN). Redundant with direction, but spares the client from having to know which enum value means "we sent it" - the same convention as WhatsApp's own fromMe.
                  externalId:
                    anyOf:
                      - type: string
                      - type: "null"
                  error:
                    anyOf:
                      - type: string
                      - type: "null"
                  interlocutor:
                    type: string
                    description: "Meaning depends on direction and isGroup. 1:1 chat: the other party's phone number, both directions. Group + direction IN: the participant who posted the message. Group + direction OUT: the group's own bare id, since an outbound message's author is always the account holder (never the account holder's own number). For who a reply specifically targets, see replyToParticipant instead."
                  conversationId:
                    anyOf:
                      - type: string
                      - type: "null"
                  isGroup:
                    type: boolean
                  replyToExternalId:
                    anyOf:
                      - type: string
                      - type: "null"
                    description: The externalId of the message this one quotes as a reply, or null if it isn't a reply.
                  replyToParticipant:
                    anyOf:
                      - type: string
                      - type: "null"
                    description: For a reply to a group message, the phone number of whoever posted the message being replied to - not necessarily the same as interlocutor. Null outside that case.
                  retryCount:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                  messagingAccountId:
                    type: string
                  status:
                    type: string
                    enum:
                      - PENDING
                      - SENDING
                      - SENT
                      - DELIVERED
                      - READ
                      - FAILED
                      - UNDELIVERABLE
                  channel:
                    type: string
                    enum:
                      - WHATSAPP
                      - SMS
                      - EMAIL
                  accountChannel:
                    type: string
                    enum:
                      - WHATSAPP_BAILYES
                      - EMAIL
                      - SMS
                      - WHATSAPP_WHATSMEOW
                  watermarked:
                    type: boolean
                    description: Whether the "Sent with UnlimitedMessaging.app" line was appended. Never on the paid plans (Medium, Max), nor on media and product messages; on the Free plan, text messages and emails only.
                  subject:
                    anyOf:
                      - type: string
                      - type: "null"
                    description: The email subject. Null on channels without one.
                  contentHtml:
                    anyOf:
                      - type: string
                      - type: "null"
                    description: "The rich body, as sent or received. Untrusted for an inbound message: sanitise before rendering."
                  dispatchId:
                    type: string
                  attachments:
                    type: array
                    items:
                      type: object
                      properties:
                        url:
                          type: string
                        filename:
                          anyOf:
                            - type: string
                            - type: "null"
                        mimeType:
                          type: string
                        size:
                          type: integer
                          minimum: 0
                          maximum: 9007199254740991
                        contentId:
                          anyOf:
                            - type: string
                            - type: "null"
                          description: Set for an inline image the HTML body references as cid:<contentId>.
                      required:
                        - url
                        - filename
                        - mimeType
                        - size
                        - contentId
                      additionalProperties: false
                  mediaUrl:
                    anyOf:
                      - type: string
                      - type: "null"
                    deprecated: true
                    description: "Deprecated: use `attachments` instead (this is the first one)."
                  mediaType:
                    anyOf:
                      - type: string
                      - type: "null"
                    deprecated: true
                    description: "Deprecated: use `attachments` instead (this is the first one)."
                  mimeType:
                    anyOf:
                      - type: string
                      - type: "null"
                    deprecated: true
                    description: "Deprecated: use `attachments` instead (this is the first one)."
                  mediaFilename:
                    anyOf:
                      - type: string
                      - type: "null"
                    deprecated: true
                    description: "Deprecated: use `attachments` instead (this is the first one)."
                  transcript:
                    anyOf:
                      - type: string
                      - type: "null"
                    description: "Text extracted from the media: OCR of an image or a scanned PDF, the text of a PDF, a voice note's transcription. Not produced yet: always null for now."
                  productData:
                    anyOf:
                      - type: object
                        propertyNames:
                          type: string
                        additionalProperties: {}
                      - type: "null"
                  sentAt:
                    anyOf:
                      - type: string
                        format: date-time
                        pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                      - type: "null"
                    description: "When the message was sent, per the channel: WhatsApp's own timestamp for a received message or one typed on the phone, the moment it went out for one sent through the API. Order conversations on this rather than createdAt. Null until an API send goes out."
                  deletedAt:
                    anyOf:
                      - type: string
                        format: date-time
                        pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                      - type: "null"
                    description: When the message was deleted for everyone, null if it was not.
                  createdAt:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                  updatedAt:
