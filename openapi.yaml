            schema:
              type: object
              properties:
                externalId:
                  type: string
                  minLength: 1
                  description: "The `externalId` of the oldest message you hold in the conversation: the messages before it are requested."
                count:
                  default: 50
                  description: How many earlier messages to ask for, 1 to 50.
                  type: integer
                  minimum: 1
                  maximum: 50
              required:
                - externalId
