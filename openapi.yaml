                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                  key:
                    type: string
                required:
                  - id
                  - name
                  - prefix
                  - expiresAt
                  - lastUsedAt
                  - revokedAt
                  - createdAt
                  - updatedAt
                  - key
                additionalProperties: false
          description: ""
        "400":
          description: Invalid request parameters or body.
        "401":
          description: Missing or invalid authentication credentials.
        "403":
          description: Insufficient permissions to access this resource.
      security:
        - bearer: []
      summary: Create an API key
      tags:
        - API Keys
    get:
      description: |-
        **Protection**: Protected endpoint. Allowed roles: USER, ADMIN. Required scopes: OTHER:READ

        Returns all active API keys for the authenticated user. The raw key value is never returned — only metadata (id, name, prefix, dates).
      operationId: ApiKey_list
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    prefix:
                      type: string
                    expiresAt:
                      anyOf:
                        - type: string
                          format: date-time
                          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                        - type: "null"
                    lastUsedAt:
                      anyOf:
                        - type: string
                          format: date-time
                          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                        - type: "null"
                    revokedAt:
                      anyOf:
                        - type: string
                          format: date-time
                          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                        - type: "null"
                    createdAt:
                      type: string
                      format: date-time
                      pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                    updatedAt:
                      type: string
                      format: date-time
                      pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                  required:
                    - id
                    - name
                    - prefix
                    - expiresAt
                    - lastUsedAt
                    - revokedAt
                    - createdAt
                    - updatedAt
                  additionalProperties: false
          description: ""
        "401":
          description: Missing or invalid authentication credentials.
        "403":
          description: Insufficient permissions to access this resource.
      security:
        - bearer: []
      summary: List API keys
      tags:
        - API Keys
  /api-keys/{id}:
    delete:
      description: |-
        **Protection**: Protected endpoint. Allowed roles: USER, ADMIN. Required scopes: OTHER:WRITE

        Permanently revokes an API key by ID. The key is immediately invalidated and cannot be restored.
      operationId: ApiKey_revoke
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Missing or invalid authentication credentials.
        "403":
          description: Insufficient permissions to access this resource.
        "404":
          description: The requested resource was not found.
      security:
        - bearer: []
      summary: Revoke an API key
      tags:
        - API Keys
info:
  title: Unlimited Messaging
  description: |-
    Unlimited Messaging API

    ## SDKs

    - **TypeScript/Node.js**: [`@unlimited-messaging/sdk`](https://www.npmjs.com/package/@unlimited-messaging/sdk)
    - **Python**: [`unlimited-messaging`](https://pypi.org/project/unlimited-messaging/)
  version: "1.0"
  contact:
    name: Unlimited Messaging
    url: https://unlimitedmessaging.app
    email: support@unlimitedmessaging.app
  termsOfService: https://unlimitedmessaging.app/privacy
tags:
  - name: Accounts
    description: |
      
      An account is one of your own messaging identities: a WhatsApp number, a mailbox, or an Android
      phone sending SMS. Every message is sent from and received on an account. Link as many as your
      plan allows, then send with `POST /message` (pass `accountId`, or omit it to let the API pick one
      for the channel).

      | Channel | How it is linked | Through the API |
      | ------- | ---------------- | --------------- |
      | `WHATSAPP_WHATSMEOW` | Scan a QR code with the phone | `GET /account/link`, then poll `GET /account/{accountId}/challenge` |
      | `EMAIL` | IMAP/SMTP credentials of the mailbox | `POST /account/email` |
      | `SMS` | The free Android app, signed in to your account | Not linkable through the API |

      All of these work with an API key (`Authorization: Bearer <key>`). Status changes of every account
      (linked, disconnected, credentials refused...) are also sent as `account.status_changed` webhooks.

      ### Linking a WhatsApp number

      1. `GET /account/link` creates the account in status `LINKING` and returns its `accountId`.
      2. Poll `GET /account/{accountId}/challenge` every second. It returns
         `{ "challenge": { "kind": "qr", "data": "2@..." } }`: render `data` as a QR code (any QR library).
         It rotates about every 20 seconds, so keep polling and re-rendering.
      3. The user scans it in WhatsApp: **Settings > Linked devices > Link a device**.
      4. Once scanned, `challenge` becomes `null` and `GET /account/{accountId}` shows status `ACTIVE`.

      If the attempt expires, call `GET /account/link` again: the pending account is resumed, not
      duplicated. Linking numbers for several of your customers? Pass `externalRef` (your id for the
      customer) so each one resumes only their own attempt.

      ```bash
      curl -H "Authorization: Bearer $UM_API_KEY" https://api.unlimitedmessaging.app/account/link
      # { "accountId": "6f1c..." }
      curl -H "Authorization: Bearer $UM_API_KEY" https://api.unlimitedmessaging.app/account/6f1c.../challenge
      # { "challenge": { "kind": "qr", "data": "2@AbC..." } }
      ```

      ### Connecting a mailbox

      No QR code: a mailbox connects from its credentials alone and is `ACTIVE` as soon as the call returns.

      1. `GET /account/email/autoconfig?email=jane@example.com` suggests the IMAP and SMTP servers.
         If `oauthRequired` is true (Outlook.com, Hotmail, Microsoft 365), the mailbox cannot be connected yet.
      2. Optional: `POST /account/email/test` checks the credentials without saving anything.
      3. `POST /account/email` with the address, the password and the servers connects it and returns the account.

      Gmail, iCloud and Yahoo refuse the normal account password over IMAP: create an **app password**
      in the provider's security settings and send that instead. The password is stored encrypted by the
      mail service and never returned by the API.

      ```bash
      curl -X POST https://api.unlimitedmessaging.app/account/email \
        -H "Authorization: Bearer $UM_API_KEY" -H "Content-Type: application/json" \
        -d '{
          "address": "jane@example.com",
          "password": "app-password",
          "imap": { "host": "imap.gmail.com", "port": 993, "security": "tls" },
          "smtp": { "host": "smtp.gmail.com", "port": 465, "security": "tls" }
        }'
      ```

      Failures answer `422` with `context.code`: `AUTH_FAILED` (wrong password, or an app password is
      required), `OAUTH_REQUIRED`, `HOST_UNREACHABLE`, `TLS_ERROR`.
      When the password changes, or the server starts refusing it (status `INACTIVE`), send the new one
      with `PUT /account/{accountId}/email`.

      ### Through the MCP server

      An AI assistant connected to the MCP server (`https://api.unlimitedmessaging.app/mcp`) links
      both channels too:

      - **WhatsApp**: the `add-account` tool shows the QR code in the chat, to scan like above.
      - **Email**: `add-email-account` gives the link to the dashboard, where the user types the password
        themselves: it never goes through the conversation.
  - name: Messages
    description: Send and retrieve messages by WhatsApp, email or SMS.
  - name: SIMs
    description: Manage WhatsApp SIM cards linked to your account.
  - name: Webhooks
    description: |-
      Receive events as they happen instead of polling. Register an endpoint with `POST /webhooks`,
      choosing its `eventTypes` and, optionally, the `accountIds` it covers (by default every account
      you have, including ones linked later). Requires a Medium or Max plan.

      ### Delivery

      Each event is an HTTP `POST` with a JSON body:

      ```json
      { "type": "message.received", "eventId": "whd_...", "occurredAt": "2026-09-27T10:00:01.000Z", "data": { } }
      ```

      Answer with any `2xx` within 10 seconds, and do the work afterwards.

      ### Verifying the signature

      Deliveries are signed per [Standard Webhooks](https://www.standardwebhooks.com), so its libraries
      verify them as they are. Three headers come with every request:

      | Header | Content |
      | ------ | ------- |
      | `webhook-id` | The delivery id, equal to the body's `eventId`. Stable across retries. |
      | `webhook-timestamp` | Unix seconds when this attempt was sent. |
      | `webhook-signature` | `v1,` followed by the base64 HMAC-SHA256 of `{webhook-id}.{webhook-timestamp}.{raw body}`. Several space-separated entries may appear during a secret rotation: accept the request if one matches. |

      The HMAC key is your secret (returned once, by `POST /webhooks`) with its `whsec_` prefix removed,
      base64-decoded. Compute it over the raw body exactly as received, compare in constant time, and
      reject a timestamp more than 5 minutes away from your clock.

      ```js
      const key = Buffer.from(secret.replace(/^whsec_/, ''), 'base64');
      const expected = crypto.createHmac('sha256', key).update(`${id}.${timestamp}.${rawBody}`).digest('base64');
      const valid = signatureHeader.split(' ').some((s) => s === `v1,${expected}`);
      ```

      ### Retries

      A `2xx` marks the delivery done. A `429`, a `5xx`, a timeout or a network error is retried
      after 30 s, 2 min, 10 min, 1 h, 6 h, 1 day, 2 days: 8 attempts in all, over a little more than 3 days. Any other
      `4xx` is final and never retried. Delivery attempts are kept for 30 days.

      ### Ordering and duplicates

      Delivery is at least once: the same event can arrive twice, so deduplicate on `eventId` (equal to
      the `webhook-id` header and kept across retries). `eventId` is per endpoint: two endpoints
      receiving the same event get two ids, so deduplicate across endpoints on the message's `id` or
      `externalId` instead. A message is also never announced twice: `message.externalId` is unique per
      account, and each message is announced by one of `message.received`, `message.self_sent` or
      `message.sent`, never by two.

      **Events are not delivered in the order things happened.** Retries reorder them, and a message with
      media is only announced once its media is stored, a few seconds after it arrived: a text sent right
      after a photo usually reaches you first. Never order on arrival. Every event carries the channel's
      own timestamp to order on:

      | Event | Order on |
      | ----- | -------- |
      | `message.received`, `message.self_sent`, `message.sent` | `data.message.sentAt` (WhatsApp's timestamp) |
      | `message.status` | `data.message.at`, and `previousStatus` to ignore a stale one |
      | `message.reaction` | `data.reaction.sentAt` |
      | `message.edited` | `data.edit.editedAt` |
      | `message.deleted` | `data.deletion.deletedAt` |
      | `account.status_changed` | `data.account.at` |
      | `group.updated` | `data.at` |

      `GET /message` returns the same `sentAt`.

      **A change can arrive before the message it changes.** A reaction, an edit or a deletion names its
      target by `externalId` (`reactedToExternalId`, `edit.externalId`, `deletion.externalId`), and
      by UnlimitedMessaging id (`reactedToMessageId`, `messageId`) only when that message was already
      stored. A reaction to a photo typically beats the photo, which is announced once its media is stored:
      the id is then `null`. Keep such an event and link it later by `externalId`, which the message
      carries when it arrives (`message.externalId`).

      ### Events

      | Type | When |
      | ---- | ---- |
      | `message.received` | A message arrived. |
      | `message.self_sent` | The account's own phone sent a message by hand, outside the API. |
      | `message.sent` | A message you sent through the API reached the channel. Carries its content. |
      | `message.status` | A message you sent changed status: `SENT`, `DELIVERED`, `READ`, `FAILED` or `UNDELIVERABLE`. |
      | `message.reaction` | Someone reacted to a message, or took their reaction back. |
      | `message.edited` | A message was edited. |
      | `message.deleted` | A message was deleted for everyone. |
      | `message.history` | Past messages, in batches, for an account linked with `syncHistory`. |
      | `group.updated` | A group the account is in changed. |
      | `account.status_changed` | An account's status changed. |

      An endpoint receives only the types listed in its `eventTypes`: there is no "every event" option,
      and a type added later is never turned on for existing endpoints. To start receiving one, send the
      full list you want with `PATCH /webhooks/{id}` (`eventTypes` replaces the previous list).

      The four `message.received`, `message.self_sent`, `message.sent` and `message.history` events carry
      the same message object (`data.message`, or each item of `data.messages`): `id` (UnlimitedMessaging),
      `externalId` (WhatsApp), `direction` (`IN` or `OUT`), `fromMe`, `content`, `sentAt` (the channel's
      timestamp), `receivedAt` (when UnlimitedMessaging recorded it), `sender`, `senderId`, `senderName`,
      `participant`, `replyTo`, `transcript`, the media fields described below, and for email `subject`,
      `html` and `attachments`. Message events also carry `data.channel`: `type` (`WHATSAPP`, `EMAIL`),
      `account` (`id`, `name`) and `conversation` (`id`, `isGroup`, `address`, and `participants` for a
      group).

      #### message.received

      A message arrived on one of your accounts, in a 1:1 conversation or a group. Fired once per message:
      a message WhatsApp delivers twice, or that a history sync brings again, is not announced again. A
      message with media is announced once its media is stored, so it carries `mediaUrl` (or
      `mediaError`). `direction` is `IN`, `fromMe` is `false`. Not fired for the account's own messages:
      those are `message.self_sent` or `message.sent`.

      #### message.self_sent

      The account's own phone, or another device linked to it, sent a message by hand, outside the API.
      Same shape as `message.received`, with `direction: "OUT"`, `fromMe: true`, and `sender` the
      account's own number. Fired once per message. Never fired for a message sent through the API, even
      though WhatsApp echoes those back too: that is `message.sent`.

      #### message.sent

      A message you sent through the API (`POST /message`, a reply) reached the channel. Same shape as
      `message.self_sent`: `direction: "OUT"`, `fromMe: true`, with the `content`, `externalId`, `sentAt`,
      the conversation it went to (`conversation.id`, `isGroup`, `address`, and `participants` for a group
      when they could be read) and, for a media message, `mediaUrl`, `mediaType`, `mimeType` and
      `mediaFilename`. `id` is the one `POST /message` returned.

      It fires exactly once per message, when the message first reaches the channel: on its move from
      `PENDING` or `SENDING` to `SENT`, or straight to `DELIVERED` or `READ` when the channel skips `SENT`.
      By then its `externalId` is known. Later receipts (`DELIVERED`, `READ`) never fire it again, nor does
      a retry or a duplicate receipt. A message that never goes out (`FAILED`, `UNDELIVERABLE`) never fires
      it: watch `message.status` for those. Not fired for a message typed on the phone
      (`message.self_sent`) or for a received message. A message that had already reached the channel
      before this event existed is not announced.

      `message.sent` and the `message.status` reporting `SENT` come from the same change and are delivered
      independently: either can arrive first.

      #### message.status

      A message you sent changed status. `data.message` holds `id`, `externalId`, `status`,
      `previousStatus`, `error` (why a `FAILED` or `UNDELIVERABLE` message did not go through), `at` (when
      the status changed) and `sentAt`. No content: that is `message.sent`. Fired once per effective
      change to `SENT`, `DELIVERED`, `READ`, `FAILED` or `UNDELIVERABLE`; `PENDING` and `SENDING` are
      UnlimitedMessaging's own queueing steps and are not reported. A receipt arriving out of order (a
      `DELIVERED` after a `READ`) changes nothing and fires nothing. A failed message that is retried goes
      through `SENT` again from `SENDING`. Receipts WhatsApp reports for a message typed on the phone
      (stored as `SENT`) fire it too.

      #### message.reaction

      Someone reacted to a message, or took their reaction back (`removed: true`, empty `emoji`). The
      account's own reactions are included, with `fromMe: true`. `data.reaction` holds `emoji`, `removed`,
      `reactedToExternalId`, `reactedToMessageId` (null when that message is not stored, see below),
      `sender`, `senderId`, `senderName`, `participant` (in a group), `fromMe` and `sentAt`. Nothing is
      stored: a reaction is not a message.

      #### message.edited

      A message was edited, by its author. `data.edit` holds `externalId`, `messageId`, `newContent`,
      `kind` (`text`, or `caption` for the caption of an image, video or document), `error`, `editedAt`,
      `sender`, `senderId`, `participant` and `fromMe`. The stored content is updated. Phones encrypt an
      edit with the original message's key: when it cannot be opened (`error`: `original_secret_missing`
      for a message the account received before it was linked, `decryption_failed` otherwise), the edit is
      still announced, with `newContent` and `kind` null, and the stored content is left as it was.

      #### message.deleted

      A message was deleted for everyone, by its author or a group admin. `data.deletion` holds
      `externalId`, `messageId`, `deletedAt`, `deletedBy`, `deletedById`, `participant` and `fromMe`. The
      stored message is kept, with `deletedAt` set.

      #### message.history

      Past messages, in batches of up to 100, for an account linked with `syncHistory` (see History
      below), or asked for with `POST /account/{accountId}/history`. `data` holds `syncType`,
      `chunkOrder`, `progress`, `isLatest`, `channel` (`type`, `account`) and `messages`, each shaped like
      the message of `message.received` plus its own `conversation`. Only messages stored for the first
      time are included. Never sent to an endpoint that did not subscribe to it, and never fired for an
      account that did not ask for its history.

      #### group.updated

      A group the account is in changed (beta accounts). `data` holds `group.id`, `by` (who made the
      change, when the channel says), `at`, `name`, `topic`, and the members `added`, `removed`,
      `promoted` and `demoted` (+E164, or an id when the number is hidden). A field that did not change is
      null or empty.

      #### account.status_changed

      An account's status changed: connected, disconnected, logged out, restricted by WhatsApp
      (`BLOCKED`, with `blockedUntil`), reconnected, deleted... `data.account` holds `id`, `name`,
      `status`, `previousStatus`, `reason`, `transportCode`, `blockedUntil` and `at`. Fired on every
      effective change only: a status reported again unchanged fires nothing. `reason` is a
      machine-readable code (`connected`, `disconnected`, `device_removed` when the device was removed
      from the phone, `logged_out` when WhatsApp refused the session, `temporary_ban`, `restricted`,
      `restriction_lifted`, `deleted`, `linking_started`...); treat an unknown value as "changed for another
      reason", the list grows. `transportCode` is WhatsApp's own numeric code, for diagnosis.

      #### message.transcribed

      Reserved for the text extracted from media (OCR, PDF text, voice transcription). It is not fired yet
      and cannot be subscribed to; `transcript` is `null` on messages until it is.

      The schema of each payload is published with this reference, under `WebhookEvent*`.

      **Identifiers.** `message.externalId` is the message's id on WhatsApp: reactions
      (`reactedToExternalId`), edits and quoted replies (`replyTo.externalId`) refer to it.
      `sender` is a phone number in E.164 format, or `null` when WhatsApp hides it, in which case
      `senderId` (always set, a LID then) identifies the person. In a group, `participant` names who
      posted, `channel.conversation.id` is the group and `channel.conversation.participants` lists its
      members (+E164, or an id when the number is hidden). That list is kept in a cache refreshed when the
      group changes, so reading it on every message costs nothing: no need to call
      `GET /account/{accountId}/groups/{groupId}` per message. History batches do not carry it.

      **Media.** A media message carries `mediaType` (`image`, `video`, `document`, `audio`,
      `ptt` for a voice note, `sticker`), `mimeType`, `mediaFilename`, `mediaSize`, `durationSec`,
      and a `mediaUrl` serving the file UnlimitedMessaging stored. If it could not be stored,
      `mediaError` says why (`too_large` above 64 MB, `download_failed`) and there is no `mediaUrl`.
      The media is kept as long as its message: there is no automatic expiry. By default the URL alone
      gives access (its token is unguessable, so keep it private). For sensitive media, turn on
      `mediaUrlRequiresAuth` with `PATCH /account/{accountId}`: the URL then also requires
      `Authorization: Bearer ak_...` of a user the message belongs to (or their dashboard session),
      and answers `401` otherwise.
      `transcript` will hold the text extracted from the media (OCR, PDF text, voice transcription);
      it is `null` for now.

      ### History

      Link an account with `syncHistory=true` (`GET /account/link`, beta accounts) to receive its past
      conversations: the phone uploads its history once linked, and each part of it reaches you as
      `message.history` batches of up to 100 messages, each shaped like `message.received` (with
      `direction: "OUT"` for the account's own) plus its own `conversation`. `syncType` says which
      part it is (`initial_bootstrap` and `recent` first, then `full`), `progress` how far along, and
      `isLatest` that no more of that part is coming. A large history takes a while: expect batches for
      minutes after the link.

      Only messages stored for the first time are announced, so linking the same number again, or history
      overlapping live traffic, never repeats a message. History media is described (`mediaType`,
      `mimeType`, `mediaFilename`) but not stored: there is no `mediaUrl`. Subscribe to
      `message.history` only if you want it: endpoints that do not are never sent it.

      To go further back in one conversation, `POST /account/{accountId}/history` with the
      `externalId` of the oldest message you hold: the earlier messages arrive as a
      `message.history` batch with `syncType: "on_demand"`. `PATCH /account/{accountId}` turns
      `syncHistory` on or off for what WhatsApp sends from then on.

      ### Sending pace

      Each account keeps a pause between two sends, 5 seconds by default, which protects the number from
      being flagged by WhatsApp for bursts. Tune it per account with `PATCH /account/{accountId}`
      (`sendIntervalSeconds`, 2 to 120). Send invoices and reminders with
      `priority: "transactional"` on `POST /message`: they are taken before normal messages already
      waiting. Messages sent on a paid plan never carry a watermark.
servers:
  - url: https://api.unlimitedmessaging.app
    description: production
  - url: http://localhost:19300
    description: development
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    WebhookEventMessageReceived:
      type: object
      properties:
        type:
          type: string
          enum:
            - message.received
        eventId:
          type: string
        occurredAt:
